<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>
  <g font-size="13" fill="#1d1c19">
    <!-- T1 -->
    <rect x="20" y="20" width="370" height="205" rx="10" fill="#f6f8fb" stroke="#d5dbe4"/>
    <text x="36" y="48" font-size="15" font-weight="bold">T1 · nominal</text>
    <rect x="36" y="64" width="338" height="70" rx="4" fill="#2e2f33"/>
    <line x1="36" y1="99" x2="374" y2="99" stroke="#d9d9d9" stroke-dasharray="6 6"/>
    <rect x="90" y="106" width="24" height="12" rx="3" fill="#2a78d6"/>
    <rect x="160" y="106" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="130" y="76" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="240" y="76" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="300" y="106" width="24" height="12" rx="3" fill="#9a9a9a"/>
    <text x="36" y="160">the condition every learned model was trained on;</text>
    <text x="36" y="178">also the horizon sweep (2, 3, 5 decisions)</text>
    <text x="36" y="208" fill="#5a5f66">success, speed, return, regret, latency; every system</text>
    <!-- T2 -->
    <rect x="415" y="20" width="370" height="205" rx="10" fill="#f6f8fb" stroke="#d5dbe4"/>
    <text x="431" y="48" font-size="15" font-weight="bold">T2 · vehicle change</text>
    <rect x="431" y="64" width="338" height="70" rx="4" fill="#2e2f33"/>
    <line x1="431" y1="99" x2="769" y2="99" stroke="#d9d9d9" stroke-dasharray="6 6"/>
    <rect x="485" y="104" width="30" height="16" rx="3" fill="#2a78d6"/><rect x="489" y="98" width="22" height="7" rx="2" fill="#7fb0ea"/><text x="485" y="128" font-size="10.5" fill="#7fb0ea">loaded ego</text>
    <rect x="600" y="106" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="540" y="76" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="700" y="76" width="24" height="12" rx="3" fill="#9a9a9a"/>
    <text x="431" y="160">loaded vehicle: gain halved,</text><text x="431" y="178">acceleration ≤ 1.5, braking ≤ 4 m/s²</text>
    <text x="431" y="208" fill="#5a5f66">analytic members: new parameters, no data; learned: 0–10k</text>
    <!-- T3 -->
    <rect x="810" y="20" width="370" height="205" rx="10" fill="#f6f8fb" stroke="#d5dbe4"/>
    <text x="826" y="48" font-size="15" font-weight="bold">T3 · traffic change</text>
    <rect x="826" y="64" width="338" height="70" rx="4" fill="#2e2f33"/>
    <line x1="826" y1="99" x2="1164" y2="99" stroke="#d9d9d9" stroke-dasharray="6 6"/>
    <rect x="880" y="106" width="24" height="12" rx="3" fill="#2a78d6"/>
    <rect x="914" y="106" width="24" height="12" rx="3" fill="#c0392b"/><rect x="944" y="106" width="24" height="12" rx="3" fill="#c0392b"/><rect x="900" y="76" width="24" height="12" rx="3" fill="#c0392b"/><rect x="990" y="76" width="24" height="12" rx="3" fill="#c0392b"/><rect x="1030" y="106" width="24" height="12" rx="3" fill="#c0392b"/><rect x="1080" y="76" width="24" height="12" rx="3" fill="#c0392b"/><rect x="1110" y="106" width="24" height="12" rx="3" fill="#c0392b"/>
    <text x="826" y="160">aggressive drivers, 1.5× density</text>
    <text x="826" y="178">(≥ 10,500 logged transitions per seed)</text>
    <text x="826" y="208" fill="#5a5f66">only the traffic member is retrained; monolith whole</text>
    <!-- T4 -->
    <rect x="20" y="250" width="370" height="205" rx="10" fill="#f6f8fb" stroke="#d5dbe4"/>
    <text x="36" y="278" font-size="15" font-weight="bold">T4 · stale message</text>
    <rect x="36" y="294" width="338" height="70" rx="4" fill="#2e2f33"/>
    <line x1="36" y1="329" x2="374" y2="329" stroke="#d9d9d9" stroke-dasharray="6 6"/>
    <rect x="90" y="336" width="24" height="12" rx="3" fill="#2a78d6"/>
    <rect x="210" y="336" width="24" height="12" rx="3" fill="#9a9a9a"/><rect x="160" y="336" width="24" height="12" rx="3" fill="none" stroke="#9a9a9a" stroke-dasharray="3 2"/>
    <text x="250" y="318" font-size="11.5" fill="#f2c14e" font-family="Menlo, Consolas, monospace">t − k</text>
    <text x="36" y="390">traffic message k = 1, 2, 4 decisions old,</text><text x="36" y="408">at every decision</text>
    <text x="36" y="438" fill="#5a5f66">contract check on / off; abstentions counted</text>
    <!-- T5 -->
    <rect x="415" y="250" width="370" height="205" rx="10" fill="#fff7f3" stroke="#f0d6c8"/>
    <text x="431" y="278" font-size="15" font-weight="bold">T5 · withheld combination</text><rect x="662" y="263" width="106" height="20" rx="10" fill="#eb6834"/><text x="715" y="277" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">no data used</text>
    <rect x="431" y="294" width="338" height="70" rx="4" fill="#2e2f33"/>
    <line x1="431" y1="329" x2="769" y2="329" stroke="#d9d9d9" stroke-dasharray="6 6"/>
    <rect x="485" y="334" width="30" height="16" rx="3" fill="#2a78d6"/><rect x="489" y="328" width="22" height="7" rx="2" fill="#7fb0ea"/><text x="485" y="358" font-size="10.5" fill="#7fb0ea">loaded ego</text>
    <rect x="560" y="336" width="24" height="12" rx="3" fill="#c0392b"/><rect x="590" y="336" width="24" height="12" rx="3" fill="#c0392b"/><rect x="545" y="306" width="24" height="12" rx="3" fill="#c0392b"/><rect x="650" y="306" width="24" height="12" rx="3" fill="#c0392b"/><rect x="690" y="336" width="24" height="12" rx="3" fill="#c0392b"/><rect x="730" y="306" width="24" height="12" rx="3" fill="#c0392b"/>
    <text x="431" y="390">both changes at once,</text><text x="431" y="408">a condition no learned model has seen</text>
    <text x="431" y="438" fill="#5a5f66">members adapted apart; monoliths: both shifted sets</text>
    <!-- T6 -->
    <rect x="810" y="250" width="370" height="205" rx="10" fill="#f6f8fb" stroke="#d5dbe4"/>
    <text x="826" y="278" font-size="15" font-weight="bold">T6 · interface faults</text>
    <rect x="826" y="294" width="338" height="70" rx="4" fill="#2e2f33"/>
    <!-- timeline: 30 s episode, fault window 5-15 s -->
    <line x1="846" y1="344" x2="1144" y2="344" stroke="#d9d9d9" stroke-width="2"/>
    <rect x="896" y="334" width="99" height="20" rx="3" fill="#f2c14e" fill-opacity="0.35" stroke="#f2c14e"/>
    <text x="846" y="360" font-size="10.5" fill="#d9d9d9">0 s</text>
    <text x="896" y="328" font-size="10.5" fill="#f2c14e">5 s</text>
    <text x="995" y="328" font-size="10.5" fill="#f2c14e" text-anchor="end">15 s</text>
    <text x="1144" y="360" font-size="10.5" fill="#d9d9d9" text-anchor="end">30 s</text>
    <text x="1010" y="312" font-size="11.5" fill="#f2c14e" font-family="Menlo, Consolas, monospace">t−2 · world · km/h · ∅</text>
    <text x="826" y="390">during a 10 s window the traffic message is stale,</text>
    <text x="826" y="408">in the wrong frame, in the wrong units, or missing</text>
    <text x="826" y="438" fill="#5a5f66">contract on / off; monoliths get the same corruption</text>
  </g>
</svg>
